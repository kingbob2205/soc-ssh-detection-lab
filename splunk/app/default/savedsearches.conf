[SOC Lab - Repeated SSH failures]
disabled = 1
enableSched = 1
cron_schedule = * * * * *
dispatch.earliest_time = -1m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
search = index=soc_lab sourcetype="soclab:sshd" "Failed password" | rex field=_raw "Failed password for (?:invalid user )?(?<user>\S+) from (?<src_ip>\d{1,3}(?:\.\d{1,3}){3}) port (?<src_port>\d+)" | where isnotnull(src_ip) | stats count as failures values(user) as users by host src_ip | where failures >= 5
